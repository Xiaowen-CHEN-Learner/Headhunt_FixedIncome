name: Bond example checks

on:
  push:
    branches: [main]
    paths: ['bond_demo.py', 'tests/**', 'examples/**', '.github/workflows/bond-example.yml']
  pull_request:
    paths: ['bond_demo.py', 'tests/**', 'examples/**', '.github/workflows/bond-example.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 as inspected 2026-10-03
        with:
          persist-credentials: false
      - name: Show Python version
        run: python3 --version
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run documented example
        run: python3 bond_demo.py
